---
- name: Publish Kakakin Android release in existing African Apps Store
  hosts: all
  become: true
  vars:
    kakakin_store_source: /opt/kakakin-store-release
  tasks:
    - name: Pull current store source without discarding edits
      ansible.builtin.git:
        repo: https://github.com/olamidebello/africanappsstore.git
        dest: '{{ kakakin_store_source }}'
        version: main
        force: false
    - name: Verify APK before installation
      ansible.builtin.command:
        argv: [sha256sum, -c, kakakin.apk.sha256]
        chdir: '{{ kakakin_store_source }}/static/kakakin'
      changed_when: false
    - name: Deploy store code and assets using existing backup and rollback mechanism
      ansible.builtin.command:
        argv: [python3, '{{ kakakin_store_source }}/tools/update_store.py']
      register: store_update
      changed_when: "'UPDATED' in store_update.stdout"
    - name: Verify public HTTPS release files
      ansible.builtin.uri:
        url: 'https://africanappsstore.space{{ item }}'
        method: HEAD
        validate_certs: true
        status_code: 200
      loop: [/downloads/kakakin.apk, /downloads/kakakin.apk.sha256, /downloads/kakakin-logo.png]
    - name: Verify public catalog listing
      ansible.builtin.uri:
        url: https://africanappsstore.space/api/hosted-apps
        return_content: true
        validate_certs: true
      register: catalog
      failed_when: catalog.status != 200 or 'kakakin.africandroid.world' not in catalog.content
